<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ad.css">
<style>:root{--w:1080px;--h:1350px;--u:10px;--pad:64px}
.panel{position:absolute;left:64px;right:64px;top:64px;height:960px;overflow:hidden;background:#fff}
.panel img{width:100%;height:100%}
.cover img{object-fit:cover}
.contain{background:var(--ivory)} .contain img{object-fit:contain;mix-blend-mode:multiply;filter:brightness(1.08) contrast(1.08);clip-path:inset(6px);}
.meta{position:absolute;left:64px;right:64px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.name{font-size:96px;margin-top:18px}
.sw{width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);margin-bottom:16px}
</style></head><body><div class="ad">
<div class="panel" id="panel"><img id="img" alt=""></div>
<div class="meta"><div><p class="eyebrow" style="color:var(--muted)" id="prod"></p><h1 class="display name" id="col"></h1></div><i class="sw" id="sw"></i></div>
</div></body></html>
